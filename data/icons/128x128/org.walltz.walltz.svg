<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="photo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>
  
  <!-- Blurred background circle -->
  <circle cx="64" cy="64" r="40" fill="#6ab0f0" opacity="0.4"/>
  <circle cx="50" cy="50" r="25" fill="#8ad0f0" opacity="0.3"/>
  <circle cy="70" r="30" fill="#4a80c0" opacity="0.3"/>
  
  <!-- Photo frame -->
  <rect x="34" y="30" width="60" height="60" rx="4" ry="4" fill="url(#photo)" stroke="#ccc" stroke-width="2"/>
  
  <!-- Photo content - mountain -->
  <polygon points="34,90 55,55 70,70 80,50 94,90" fill="#7cb342"/>
  <polygon points="50,90 65,65 80,90" fill="#558b2f"/>
  
  <!-- Sun -->
  <circle cx="75" cy="45" r="8" fill="#fdd835"/>
  
  <!-- Small "W" watermark -->
  <text x="64" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">W</text>
</svg>
